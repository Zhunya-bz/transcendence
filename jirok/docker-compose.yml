name: jirok
version: '3.8'

services:
  #the database container
  db:
    image: postgres:15-alpine
    container_name: jirok_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER} #taken form the .env file
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} #this too from the .env file
      POSTGRES_DB: ${POSTGRES_DB} #this too from .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  #the backend API container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jirok_backend
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jirok_frontend
    ports:
      - "3000:3000"
    restart: unless-stopped  

volumes:
  postgres_data: