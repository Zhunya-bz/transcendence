name: jirok
version: '3.8'

services:
  #the database container
  db:
    image: postgres:15-alpine
    container_name: jirok_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER} #taken form the .env file
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} #this too from the .env file
      POSTGRES_DB: ${POSTGRES_DB} #this too from .env
    networks:
      - private_net
      - public_net # remove if you don't want the db to be accessible from the frontend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  #the backend API container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jirok_backend
    networks:
      - public_net
      - private_net
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jirok_frontend
    networks:
      - public_net
    restart: unless-stopped  
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile

    container_name: jirok_nginx
    networks:
      - public_net
    ports:
      - "80:80"
      - "443:443"

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
  node_modules:

networks:
  public_net:      # nginx <-> frontend/backend
    driver: bridge
  private_net:     # backend <-> db only
    driver: bridge
    internal: true # 🔑 no outside internet access at all